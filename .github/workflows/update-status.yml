name: Update Status

on:
  workflow_dispatch:
  schedule:
    # Weekly: Monday 03:00 UTC
    - cron: '0 3 * * 1'
  push:
    paths:
      - 'bucket/*.json'
      - 'scripts/check-health.ps1'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Health check & update README
        shell: pwsh
        run: |
          & ./scripts/check-health.ps1 -UpdateReadme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit status update if changed
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet README.md
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No README changes.'
            exit 0
          }
          git commit -m 'docs: 自动更新软件维护状态'
          git push
